# Stage-1 PatchMoE candidate configuration.
#
# This is sized for the current 2x H100 80GB server as a Stage-1 pilot, not
# the full 8x A100 roadmap target. Set dump_dir/data paths from the launcher.

dump_dir: ???
name: "patchmoe_stage1_candidate"
steps: 100000
max_steps: null
probe_freq: null
seed: 777
grad_acc_steps: 1

optim:
  lr: 3e-04
  warmup: 2000
  lr_min_ratio: 0.1
  clip: 10.0

distributed:
  fsdp_type: full_shard
  dp_shard: 2
  dp_replicate: 1
  model_dtype: bf16
  matmul_allow_tf32: true
  selective_activation_checkpointing: false
  compile: false
  tp_size: 1

model:
  dim: 768
  dim_global: 768
  dim_local_encoder: 384
  dim_local_decoder: 384
  dim_token: 384
  vocab_size: 260

  n_layers_global: 12
  n_layers_local_encoder: 4
  n_layers_local_decoder: 4
  n_heads: 12
  n_heads_global: 12
  n_heads_local_encoder: 8
  n_heads_local_decoder: 8
  n_kv_heads_global: null

  patch_size: 6
  patching_mode: "entropy"
  patching_threshold: null
  patching_threshold_add: null
  monotonicity: false
  patching_batch_size: 1
  patching_device: "cuda"
  max_patch_length: null

  max_encoder_seq_length: 6144
  max_seqlen: 2048
  max_length: 2048
  pad_to_max_length: true
  local_attention_window_len: 512

  tie_local_encoder_decoder_logits: false
  patch_in_forward: false
  use_local_encoder_transformer: true
  encoder_hash_byte_group_size: [4]
  encoder_hash_byte_group_vocab: 50002
  encoder_hash_byte_group_nb_functions: 3
  encoder_enable_byte_ngrams: false

  cross_attn_encoder: true
  cross_attn_decoder: true
  cross_attn_window_encoder: 512
  cross_attn_window_decoder: 512
  cross_attn_k: 8
  cross_attn_nheads: 4
  cross_attn_all_layers_decoder: true
  cross_attn_all_layers_encoder: true
  cross_attn_use_flex_attention: false
  cross_attn_init_by_pooling: true

  log_patch_lengths: true
  non_linearity: "swiglu"
  use_rope: true
  recompute_fc1_out: false
  recompute_fc3_out: false
  recompute_attn: false
  custom_bwd: false
  layer_ckpt: "none"
  init_use_gaussian: true
  init_use_depth: "current"
  norm_type: "rmsnorm"
  norm_affine: true
  pre_norm: true
  dropout: 0
  attn_impl: "sdpa"
  attn_bias_type: "block_causal"
  alpha_depth: "disabled"
  downsampling_by_pooling: "max"

  # Stage-1 candidate chosen from Phase-2 --all smoke:
  # 2-expert Top-2 is dense over experts and not informative; use more experts
  # than top_k so routing remains sparse while preserving the Top-2 setting.
  moe_num_experts: 8
  moe_top_k: 2
  moe_layer_frequency: 1
  moe_balance_loss_weight: 0.05
  moe_router_jitter: 0.01
  moe_router_congestion_weight: 0.0
  moe_router_z_loss_weight: 0.0
  moe_router_use_patch_length: true
  moe_router_use_patch_entropy: true
  moe_router_use_patch_byte_features: false
  moe_balance_cost: "entropy_byte"

data:
  root_dir: ???
  sources:
    fineweb_edu_10bt: 1.0
  batch_size: 1
  prefetch_size: 64
  seq_len: 2048
  max_encoder_seq_length: 6144
  load_async: true
  preprocess_dir: ???
  entropy_model_name: "transformer_100m"
  tokenizer_args:
    name: blt
    init_kwargs:
      bpe_tokenizer_path: ???
  patcher_args:
    patching_mode: entropy
    patch_size: 6.0
    patching_device: cuda
    realtime_patching: false

profiling:
  run: false

checkpoint:
  dump:
    every: 1000
    keep: 3
  eval:
    every: 5000
    keep: -1

logging:
  freq: 10

eval_on_gpus: 2
eval: null
