# Stage-0 PatchMoE smoke configuration.
# Fill in dump_dir, data.root_dir, data.preprocess_dir, and tokenizer path before use.

dump_dir: ???
name: "patchmoe_stage0"
steps: 10000
max_steps: null
probe_freq: null
seed: 777
grad_acc_steps: 1

optim:
  lr: 4e-04
  warmup: 500
  lr_min_ratio: 0.1
  clip: 10.0

distributed:
  fsdp_type: full_shard
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1

model:
  n_heads: 8
  dim: 512
  vocab_size: 260
  dim_token: 256
  patch_size: 6
  patching_mode: "static"
  tie_local_encoder_decoder_logits: false
  patch_in_forward: false
  max_encoder_seq_length: 12288
  pad_to_max_length: true
  patching_threshold: null
  encoder_hash_byte_group_size: [4]
  encoder_hash_byte_group_vocab: 50002
  encoder_hash_byte_group_nb_functions: 3
  encoder_enable_byte_ngrams: false
  cross_attn_encoder: true
  cross_attn_decoder: true
  cross_attn_window_encoder: 512
  cross_attn_window_decoder: 512
  dim_global: 512
  dim_local_encoder: 256
  dim_local_decoder: 256
  n_layers_global: 8
  n_layers_local_encoder: 4
  n_layers_local_decoder: 4
  n_heads_global: 8
  n_heads_local_encoder: 8
  n_heads_local_decoder: 8
  cross_attn_k: 8
  cross_attn_nheads: 4
  cross_attn_all_layers_decoder: true
  cross_attn_all_layers_encoder: true
  cross_attn_use_flex_attention: true
  cross_attn_init_by_pooling: true
  log_patch_lengths: true
  non_linearity: "swiglu"
  use_rope: true
  recompute_fc1_out: false
  recompute_fc3_out: false
  recompute_attn: false
  custom_bwd: false
  layer_ckpt: "none"
  use_local_encoder_transformer: true
  init_use_gaussian: true
  init_use_depth: "current"
  attn_impl: "xformers"
  attn_bias_type: "block_causal"
  alpha_depth: "disabled"
  max_length: 256
  local_attention_window_len: 512
  max_seqlen: 12288
  downsampling_by_pooling: "max"

  # Patch-level MoE is applied only in the global latent Transformer.
  moe_num_experts: 4
  moe_top_k: 2
  moe_layer_frequency: 1
  moe_balance_loss_weight: 0.01
  moe_router_jitter: 0.0
  moe_router_use_patch_length: false
  moe_router_use_patch_entropy: false
  moe_balance_cost: "patch"

data:
  root_dir: ???
  sources:
    dclm_baseline_1.0: 1.0
  batch_size: 2
  prefetch_size: 64
  seq_len: 4096
  load_async: true
  preprocess_dir: ???
  tokenizer_args:
    name: blt
    init_kwargs:
      bpe_tokenizer_path: ???
  patcher_args:
    patching_mode: static
    patch_size: 6

profiling:
  run: false

checkpoint:
  dump:
    every: 500
    keep: 3
  eval:
    every: 1000
    keep: -1

logging:
  freq: 10

eval_on_gpus: 8
eval: null
